{% extends "base.html" %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card card-custom p-5 mx-auto shadow-sm" style="max-width: 550px;">
    <div class="mb-3 text-secondary">
      <i class="bi bi-exclamation-octagon-fill" style="font-size: 4rem;"></i>
    </div>
    <h2 class="fw-bold text-dark">500 - Unexpected Server Error</h2>
    <p class="text-muted mt-2">
      Something went wrong on our end while processing your request. The error has been logged and our team is looking into it.
    </p>
    <div class="mt-4">
      <a href="{{ url_for('index') }}" class="btn btn-primary px-4 rounded-pill">
        <i class="bi bi-house-door me-1"></i> Return to Safety
      </a>
    </div>
  </div>
</div>
{% endblock %}
