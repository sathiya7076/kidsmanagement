{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card card-custom p-5 mx-auto shadow-sm" style="max-width: 550px;">
    <div class="mb-3 text-warning">
      <i class="bi bi-search" style="font-size: 4rem;"></i>
    </div>
    <h2 class="fw-bold text-dark">404 - Page Not Found</h2>
    <p class="text-muted mt-2">
      The requested child record, log entry, or page could not be located.
    </p>
    <div class="mt-4">
      <a href="{{ url_for('index') }}" class="btn btn-primary px-4 rounded-pill">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
