{% extends "base.html" %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card card-custom p-4 shadow-sm">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.6rem; background: linear-gradient(135deg, #10b981, #06b6d4);">
            <i class="bi bi-shield-check"></i>
          </div>
          <h3 class="fw-bold text-dark mb-1">Set New Password</h3>
          <p class="text-muted small">Please choose a new, secure password for your account.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold small text-secondary">New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="confirm_password" class="form-label fw-semibold small text-secondary">Confirm New Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-type new password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm">
            Save New Password & Sign In
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
